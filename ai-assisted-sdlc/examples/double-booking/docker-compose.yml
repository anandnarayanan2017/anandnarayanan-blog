# Docker only: `docker compose up --build --abort-on-container-exit --exit-code-from check`
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: rooms }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rooms"]
      interval: 2s
      retries: 15
  check:
    image: node:26
    working_dir: /app
    volumes: [".:/app"]
    environment: { DATABASE_URL: "postgres://postgres:postgres@db:5432/rooms" }
    depends_on: { db: { condition: service_healthy } }
    command: sh -c "npm ci && npm run race && npm run verify"
