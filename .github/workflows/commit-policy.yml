name: Commit policy
# Only the repository owner's own commits may reach this repository and the
# live blog: every commit must be authored by the owner, committed by the
# owner or GitHub, and carry no AI co-author trailer, AI session link or
# "Generated with" line. The PR must be opened, or the push made, by the
# owner. See scripts/check-commits.sh.
#
# Checked on every PR (all of its commits, since a squash merge copies their
# trailers into main) and on every push to main and develop. The deploy
# workflow runs the same check before it publishes. Make "commit-policy" a
# required status check in the branch ruleset for main and develop so a
# failing PR cannot be merged.
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Owner-only commits, no AI co-author or session lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-commits.sh
