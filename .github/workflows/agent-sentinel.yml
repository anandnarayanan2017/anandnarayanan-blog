name: Agent Sentinel checks
on:
  push:
    branches: [main]
    paths: ["agent-sentinel/**", ".github/workflows/agent-sentinel.yml"]
  pull_request:
    paths: ["agent-sentinel/**", ".github/workflows/agent-sentinel.yml"]
permissions:
  contents: read
concurrency:
  group: agent-sentinel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-sentinel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[auth,postgres]" pytest httpx bandit pip-audit
      - name: Tests
        run: python -m pytest -q -m "not integration"
      - name: End-to-end (server, traffic, API, dashboard HTML)
        run: python scripts/e2e.py
      - name: Link check
        run: python scripts/check_links.py
      - name: Static analysis (medium+ severity)
        run: bandit -q -r app/sentinel -ll
      # PYSEC-2026-1325 (ecdsa, no fixed release): pulled in by python-jose, but
      # api/auth.py accepts RS256 only, so ecdsa never verifies a token.
      - name: Dependency audit
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2026-1325

  docker-e2e:
    # Builds the image and runs the end-to-end checks against the compose stack
    # (Agent Sentinel on PostgreSQL), so the audit chain and approvals are
    # exercised too. Results appear on the run's summary page.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-sentinel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Docker end-to-end
        run: scripts/docker_e2e.sh
