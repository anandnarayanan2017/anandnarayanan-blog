name: Agent Sentinel checks
on:
  push:
    branches: [main]
    paths: ["agent-sentinel/**", ".github/workflows/agent-sentinel.yml"]
  # No path filter on PRs: the main ruleset requires the "test" check, and a
  # filtered-out workflow never reports it, which blocks every site-only PR.
  pull_request:
permissions:
  contents: read
concurrency:
  group: agent-sentinel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-sentinel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[auth,postgres]" pytest httpx bandit pip-audit
          # ruff at the version pinned in pyproject.toml's dev extra, so a
          # ruff bump (and any change to its default rules) arrives as a PR.
          pip install "$(grep -oE 'ruff==[0-9.]+' pyproject.toml)"
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Format (ruff)
        run: ruff format --check --diff .
      - name: Tests
        run: python -m pytest -q -m "not integration"
      - name: End-to-end (server, traffic, API, dashboard HTML)
        run: python scripts/e2e.py
      - name: Link check
        run: python scripts/check_links.py
      - name: Static analysis (medium+ severity)
        run: bandit -q -r app/sentinel -ll
      # PYSEC-2026-1325 (ecdsa, no fixed release): pulled in by python-jose, but
      # api/auth.py accepts RS256 only, so ecdsa never verifies a token.
      # CVE-2026-85394 (python-jose <= 3.5.0, no fixed release): HS256 tokens
      # forged with the public key verify only when algorithms are unrestricted;
      # api/auth.py pins RS256, and test_verify_token_rejects_hs256_forged_with_
      # the_public_key proves the forged token is rejected.
      - name: Dependency audit
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2026-1325 --ignore-vuln CVE-2026-85394

  docker-e2e:
    # Builds the image and runs the end-to-end checks against the compose stack
    # (Agent Sentinel on PostgreSQL), so the audit chain and approvals are
    # exercised too. Results appear on the run's summary page.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-sentinel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker end-to-end
        run: scripts/docker_e2e.sh
