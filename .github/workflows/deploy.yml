name: Deploy blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-blog
  cancel-in-progress: false
jobs:
  # Nothing is published unless every new commit is the owner's own and the
  # owner pushed it or started the run (scripts/check-commits.sh).
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Owner-only commits, no AI co-author or session lines
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: scripts/check-commits.sh
  # Build runs third-party code (npm install scripts, Astro and Vite plugins),
  # so it gets no OIDC permission and no AWS access. It hands the finished site
  # to the deploy job as an artifact.
  build:
    needs: commit-policy
    if: github.actor == 'anandnarayanan2017'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build   # prebuild generates the posts from every series folder (scripts/sync-series.mjs)
      - run: node scripts/check-csp.mjs   # the CloudFront CSP must allow every inline script (infra/README.md)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 1
  # Deploy holds the AWS role and runs no project code: no checkout, no npm,
  # only the built files, the AWS CLI and SHA-pinned actions.
  deploy:
    needs: build
    if: github.actor == 'anandnarayanan2017'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Settings > Environments > production: required reviewer (the owner) and
    # deployment branch main only, so nothing is published without approval.
    # With an environment, the OIDC subject GitHub sends to AWS carries the
    # owner and repository IDs (confirmed in CloudTrail, 2026-11-02):
    #   repo:anandnarayanan2017@34368623/anandnarayanan-blog@1403953914:environment:production
    # The github-blog-deploy role's trust policy must match it exactly
    # (StringEquals on token.actions.githubusercontent.com:sub, with aud
    # sts.amazonaws.com). The IDs stop a renamed or re-created repository of the
    # same name from assuming the role. If AssumeRoleWithWebIdentity is denied,
    # CloudTrail (eu-central-1, event AssumeRoleWithWebIdentity) shows the
    # subject GitHub actually sent, in userIdentity.userName.
    environment:
      name: production
      url: https://anandnarayanan.net
    permissions:
      id-token: write   # OIDC to AWS; no long-lived keys
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      # Third-party action: SHA-pinned (tag v6.3.0, resolved with
      # `git ls-remote https://github.com/aws-actions/configure-aws-credentials refs/tags/v6.3.0`).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::825822360935:role/github-blog-deploy
          aws-region: eu-central-1
      - run: aws s3 sync ./dist s3://anandnarayanan-net-site --delete
      - run: aws cloudfront create-invalidation --distribution-id ESTVCZ8II465N --paths "/*"
