name: Site build
# Builds the site on every pull request, so a change that breaks the build
# (for example a missing release date) fails here instead of on the deploy
# that runs after merge. Nothing is deployed from this workflow.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build   # prebuild generates the posts from agent-sentinel/
