name: Site build
# Builds the site on every pull request, so a change that breaks the build
# (for example a missing release date) fails here instead of on the deploy
# that runs after merge. Nothing is deployed from this workflow.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build   # prebuild generates the posts from every series folder (scripts/sync-series.mjs)
      - run: node scripts/check-csp.mjs   # the CloudFront CSP must allow every inline script (infra/README.md)
