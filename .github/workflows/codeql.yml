name: CodeQL
# Code scanning for Agent Sentinel (Python), the site (JavaScript/TypeScript)
# and the workflows themselves (actions). Results appear under
# Security > Code scanning. Keep CodeQL "default setup" off in Settings: it
# conflicts with this file.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 3"   # Wednesdays: catches new queries on unchanged code
permissions:
  contents: read
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
